version: 2
updates:
  # The TypeScript port (decision 23). Every update is a pull request that must also change ts/dependency-snapshot.txt
  # (the dependency gate fails otherwise: a Dependabot PR is red until `npm run snapshot:deps` is committed to it),
  # so the reviewer sees what arrives with it. Express stays on 4 (the other
  # TypeScript services and tsoa's generated routes target it); @types follow the runtime they describe (Express 4,
  # Node 24); typescript stays inside what the shared eslint-config accepts (>=5.7 <6.1). Any other major is a reviewed
  # decision in a PR like the rest.
  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: weekly
    ignore:
      - dependency-name: express
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    open-pull-requests-limit: 5

  # ts/Dockerfile: the node:24-slim build stages and the distroless runtime.
  - package-ecosystem: docker
    directory: /ts
    schedule:
      interval: weekly

version: 2
updates:
  # Every update is a pull request that must also change dependency-snapshot.txt (the dependency gate, the `ts-checks`
  # job, fails otherwise: a Dependabot PR is red until `npm run snapshot:deps` is committed to it), so the reviewer sees
  # what arrives with it. Express stays on 4 (the other TypeScript services and tsoa's generated routes target it);
  # @types follow the runtime they describe (Express 4, Node 24); typescript stays inside what the shared eslint-config
  # accepts (>=5.7 <6.1). Any other major is a reviewed decision in a PR like the rest.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: express
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    open-pull-requests-limit: 5

  # Dockerfile: the node:24-slim build stages and the distroless runtime, both pinned by digest. Majors are ignored for
  # both so the build and runtime stages cannot diverge (node 24 stages, nodejs24 distroless): moving to Node 26 is one
  # reviewed PR that changes all three FROM lines, the engines field and the runtime floor together.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: "gcr.io/distroless/nodejs*"
        update-types: ["version-update:semver-major"]
